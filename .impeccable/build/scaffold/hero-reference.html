<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: transmittal-desk-option-1.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unna:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f6e9e8}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1586px">
  <div class="r-top-rule region chrome" data-region="top-rule"><!-- thin horizontal header rule on paper ground --></div>
  <div class="r-brand region text" data-region="brand"><!-- Internal Request Hub masthead --><p style="font-size:var(--r-brand-font);line-height:1.05;margin:0">brand</p></div>
  <div class="r-nav region control" data-region="nav"><!-- compact requester navigation: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop nav); a control need not have button chrome --></div>
  <div class="r-intro-kicker region text" data-region="intro-kicker"><!-- small uppercase request introduction --><p style="font-size:var(--r-intro-kicker-font);line-height:1.05;margin:0">intro-kicker</p></div>
  <div class="r-intro-title region text" data-region="intro-title"><!-- large requester task headline --><p style="font-size:var(--r-intro-title-font);font-family:var(--r-intro-title-family),sans-serif;font-weight:var(--r-intro-title-weight);line-height:1.05;margin:0">intro-title</p></div>
  <div class="r-intro-copy region text" data-region="intro-copy"><!-- supporting requester instruction --><p style="line-height:1.05;margin:0">intro-copy</p></div>
  <figure class="r-blueprint region plate" data-region="blueprint"><img src="../../../assets/plates/blueprint.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:top left"></figure>
  <div class="r-section-rule region chrome" data-region="section-rule"><!-- request section heading and fine rule --></div>
  <div class="r-request-one-icon region control" data-region="request-one-icon"><!-- brass circular request system icon: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop request-one-icon); a control need not have button chrome --></div>
  <div class="r-request-one-title region text" data-region="request-one-title"><!-- Sistem Baru request title --><p style="font-size:var(--r-request-one-title-font);line-height:1.05;margin:0">request-one-title</p></div>
  <div class="r-request-one-copy region text" data-region="request-one-copy"><!-- Sistem Baru request description --><p style="line-height:1.05;margin:0">request-one-copy</p></div>
  <div class="r-request-one-go region control" data-region="request-one-go"><!-- request row forward arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop request-one-go); a control need not have button chrome --></div>
  <div class="r-request-one-rule region chrome" data-region="request-one-rule"><!-- fine divider under first request row --></div>
  <div class="r-request-two-icon region control" data-region="request-two-icon"><!-- brass circular enhancement icon: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop request-two-icon); a control need not have button chrome --></div>
  <div class="r-request-two-title region text" data-region="request-two-title"><!-- Pengembangan Sistem request title --><p style="font-size:var(--r-request-two-title-font);line-height:1.05;margin:0">request-two-title</p></div>
  <div class="r-request-two-copy region text" data-region="request-two-copy"><!-- Pengembangan Sistem request description --><p style="font-size:var(--r-request-two-copy-font);line-height:1.05;margin:0">request-two-copy</p></div>
  <div class="r-request-two-go region control" data-region="request-two-go"><!-- request row forward arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop request-two-go); a control need not have button chrome --></div>
  <div class="r-request-two-rule region chrome" data-region="request-two-rule"><!-- fine divider under second request row --></div>
  <div class="r-request-three-icon region control" data-region="request-three-icon"><!-- brass circular bug report icon: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop request-three-icon); a control need not have button chrome --></div>
  <div class="r-request-three-title region text" data-region="request-three-title"><!-- Lapor Bug request title --><p style="font-size:var(--r-request-three-title-font);line-height:1.05;margin:0">request-three-title</p></div>
  <div class="r-request-three-copy region text" data-region="request-three-copy"><!-- Lapor Bug request description --><p style="font-size:var(--r-request-three-copy-font);line-height:1.05;margin:0">request-three-copy</p></div>
  <div class="r-request-three-go region control" data-region="request-three-go"><!-- request row forward arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop request-three-go); a control need not have button chrome --></div>
  <div class="r-footer-notes region text" data-region="footer-notes"><!-- small operational footer notes --><p style="font-size:var(--r-footer-notes-font);line-height:1.05;margin:0">footer-notes</p></div>
</main>
</body>
</html>
